<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>03 The Study</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>

<div style="position:relative;min-height:900px;box-sizing:border-box;padding:clamp(88px,11vh,120px) clamp(20px,4.4vw,72px) 110px;background:radial-gradient(ellipse 70% 45% at 85% 0%,#F7F3EA 0%,rgba(247,243,234,0) 70%),linear-gradient(180deg,#E9E2D3,#DED5C2);font-family:'Instrument Sans','Helvetica Neue',Arial,sans-serif;color:#292925">

  <header style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 36px;border-bottom:1px solid rgba(125,95,40,.5);padding-bottom:26px">
    <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(56px,8vw,104px);line-height:.8;color:#7D5F28;font-weight:500">03</div>
    <div style="flex:1 1 320px;min-width:0">
      <h2 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(40px,5.4vw,68px);line-height:1;font-weight:500;letter-spacing:-.01em">The Study</h2>
      <p style="margin:12px 0 0;font-size:16px;line-height:1.55;color:#4A463E;max-width:560px">The tools within reach, shelved by how often I reach for them.</p>
    </div>
  </header>

  <div style="margin-top:56px;display:flex;flex-direction:column;gap:0;max-width:1180px">
    <sc-for list="{{ shelves }}" as="sh" hint-placeholder-count="3">
      <section aria-label="{{ sh.aria }}" style="display:flex;flex-wrap:wrap;gap:20px 44px;align-items:flex-end;padding-top:6px">
        <div style="flex:0 0 190px;max-width:100%;padding-bottom:22px">
          <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;line-height:1.05;font-weight:500">{{ sh.label }}</div>
          <div style="margin-top:8px;font-size:14px;line-height:1.5;color:#4A463E">{{ sh.note }}</div>
        </div>
        <div style="flex:1 1 380px;min-width:0">
          <ul style="margin:0;padding:0 8px;list-style:none;display:flex;flex-wrap:wrap;gap:0 10px;align-items:flex-end;min-height:120px">
            <sc-for list="{{ sh.items }}" as="it" hint-placeholder-count="6">
              <li style="{{ it.style }}"><span style="{{ it.text }}">{{ it.name }}</span></li>
            </sc-for>
          </ul>
          <div aria-hidden="true" style="height:18px;background:linear-gradient(180deg,#D6BF98 0%,#C7AC80 45%,#A9895C 100%);box-shadow:0 10px 18px -8px rgba(41,41,37,.35),inset 0 1px 0 rgba(255,255,255,.45)"></div>
          <div aria-hidden="true" style="height:22px;background:linear-gradient(180deg,rgba(41,41,37,.16),rgba(41,41,37,0))"></div>
        </div>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const mats = {
      travertine: ['linear-gradient(180deg,#F1EBDD,#DDD3BE)', '#292925'],
      oak: ['linear-gradient(180deg,#D9C4A0,#C2A57A)', '#292925'],
      plaster: ['linear-gradient(180deg,#F6F2E8,#E7E0D0)', '#292925'],
      charcoal: ['linear-gradient(180deg,#3B3A34,#292925)', '#F4F0E8']
    };
    const item = (name, mat, hgt, i) => {
      const m = mats[mat];
      return {
        name,
        style: 'display:flex;align-items:flex-end;justify-content:center;box-sizing:border-box;height:' + hgt + 'px;padding:0 18px 14px;background:' + m[0] + ';box-shadow:inset 0 0 0 1px rgba(41,41,37,.14),inset 0 1px 0 rgba(255,255,255,.65),6px 0 10px -6px rgba(41,41,37,.3);border-radius:2px 2px 0 0;margin-bottom:0',
        text: "font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;font-weight:600;line-height:1;white-space:nowrap;color:" + m[1]
      };
    };
    const mk = (arr, mat, hs) => arr.map((n, i) => item(n, mat, hs[i % hs.length], i));
    const defs = [
      { label: 'Using now', note: 'The stack behind most of what I ship.', names: ['HTML5', 'CSS3', 'JavaScript', 'Figma', 'React', 'Next.js', 'Node JS', 'MongoDB', 'Git'], mat: 'travertine', hs: [118, 96, 130, 104, 124, 112, 92, 128, 100] },
      { label: 'Learning', note: 'On the bench this year.', names: ['SQLite', 'TypeScript', 'PyTorch'], mat: 'oak', hs: [104, 124, 94] },
      { label: 'Other skills', note: 'Comfortable, less often in use.', names: ['Java', 'Python', 'C'], mat: 'plaster', hs: [96, 116, 88] },
      { label: 'Also on the résumé', note: 'Listed in the résumé, not yet on the site.', names: ['Express.js', 'Flask', 'FastAPI', 'Spring Boot', 'React Native', 'SQL', 'Firebase', 'AWS', 'Railway', 'Vercel', 'MATLAB', 'JWT', 'RBAC'], mat: 'charcoal', hs: [76, 64, 84, 70, 80, 66] }
    ];
    const shelves = [];
    defs.forEach((d) => {
      const rows = Math.ceil(d.names.length / 6), per = Math.ceil(d.names.length / rows);
      for (let r = 0; r < rows; r++) {
        const part = d.names.slice(r * per, (r + 1) * per);
        shelves.push({ label: r === 0 ? d.label : '', note: r === 0 ? d.note : '', aria: d.label, items: mk(part, d.mat, d.hs.slice(r * per)) });
      }
    });
    return { shelves };
  }
}
</script>
</body>
</html>
