<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E24">
<title>House kernel (Phase 1)</title>
<link rel="stylesheet" href="./assets/fonts/fonts.css">
<style>
html,body{margin:0;background:#0B0E24}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;height:100dvh;overflow:hidden}
#note{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:11;max-width:420px;padding:16px 20px;font:15px/1.5 system-ui,sans-serif;color:#292925;background:#F4F0E8}
#quick{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:12;height:44px;padding:0 20px;font:600 15px/1 'Instrument Sans',system-ui,sans-serif;color:#F4F0E8;background:#292925;border:1px solid #292925;border-radius:2px;cursor:pointer}
#quick:hover,#quick:focus-visible{background:#7D5F28;border-color:#7D5F28;outline:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:12;padding:12px 18px;font:500 14px/1.4 'Instrument Sans',system-ui,sans-serif;color:#292925;background:#F4F0E8}
</style>
</head>
<body>
<div id="stage"></div>
<div id="note" hidden></div>
<button id="quick" type="button">Quick view →</button>
<div id="toast" hidden></div>
<div id="track"></div>
<script type="module" src="./house/app.js"></script>
</body>
</html>
